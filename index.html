<style>
/* Layout: one-column trading notebook. Ledger rows for the three markets, heat strips for the trend view, one set-off card for the day's lesson, an icon tab bar at the bottom. */
:root{
  color-scheme:light;
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E7EE; --bar:rgba(255,255,255,.88); --ink:#141B26; --muted:#5A6577; --faint:#8C95A4; --line:#D4DAE3;
  --accent:#2A4A9A; --accent-soft:#E2E8F6; --on-accent:#FFFFFF;
  --up:#C42F37; --up-soft:#FAE6E7; --down:#147A54; --down-soft:#DFF2E8; --flat-soft:#E7EAF0; --empty:#E9ECF1;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tab-h:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131A; --surface:#161D27; --sunk:#1D2632; --bar:rgba(22,29,39,.9); --ink:#E5EAF1; --muted:#98A3B4; --faint:#6E7A8C; --line:#2A3443;
    --accent:#93A9EE; --accent-soft:#1E2944; --on-accent:#0E131A;
    --up:#FF6E73; --up-soft:#3A1D22; --down:#3DCB8C; --down-soft:#123128; --flat-soft:#232C38; --empty:#1C2430;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131A; --surface:#161D27; --sunk:#1D2632; --bar:rgba(22,29,39,.9); --ink:#E5EAF1; --muted:#98A3B4; --faint:#6E7A8C; --line:#2A3443;
  --accent:#93A9EE; --accent-soft:#1E2944; --on-accent:#0E131A;
  --up:#FF6E73; --up-soft:#3A1D22; --down:#3DCB8C; --down-soft:#123128; --flat-soft:#232C38; --empty:#1C2430;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img{max-width:100%}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.brand b{color:var(--accent);font-weight:600}
.clocks{display:flex;gap:6px;flex-wrap:wrap}
.clock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.open{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.dateline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.date-big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2}
.session{font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.headline{font-family:var(--f-display);font-size:19px;line-height:1.6;font-weight:600;margin:14px 0 4px;text-wrap:balance}
.asof{font-size:12px;color:var(--muted)}
.back{display:inline-block;font-size:14px;margin-top:14px;text-decoration:none}
.page-title{font-family:var(--f-display);font-size:26px;font-weight:700;margin:22px 0 4px;line-height:1.3}
.sub{font-size:13px;color:var(--muted);margin:0}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:28px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.legend{letter-spacing:.02em;font-weight:400}
.legend b{color:var(--up);font-weight:600}.legend i{color:var(--down);font-style:normal;font-weight:600}

.mkts{display:grid;gap:12px}
.mkt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mkt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 14px;background:var(--sunk);font-weight:650;font-size:14px}
.mkt-h span{font-weight:400;font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 56px auto auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.rows>.row:first-child{border-top:0}
.nm{min-width:0;font-size:14px;line-height:1.35}
.nm small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-num);letter-spacing:.02em}
.lv{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
.pct{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;min-width:74px;text-align:right;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.pct.up{background:var(--up-soft)}.pct.down{background:var(--down-soft)}.pct.flat{background:var(--flat-soft)}
.spark{width:56px;height:20px;display:block}
.mkt-note{padding:9px 14px 11px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line)}

.macro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.m .k{font-size:12px;color:var(--muted)}
.m .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.4}
.m .c{font-family:var(--f-num);font-size:12px}

.drv{display:grid;gap:16px}
.drv h3{font-size:15px;font-weight:650;margin:0 0 2px;line-height:1.5}
.drv p{margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--flat-soft)}
.chip.up{background:var(--up-soft)}.chip.down{background:var(--down-soft)}
.chips-label{font-size:12px;color:var(--muted);margin:4px 0 6px}

.w{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.w .t{font-family:var(--f-num);font-size:12.5px;color:var(--accent);padding-top:2px}

.review{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.review ol{margin:0;padding-left:20px;display:grid;gap:6px}

.lesson{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:18px 16px 16px;margin-top:30px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.lesson h2{font-family:var(--f-display);font-size:22px;line-height:1.4;margin:4px 0 12px;text-wrap:balance}
.hook{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.core{font-weight:650;margin:12px 0 4px}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--accent);color:var(--on-accent);text-decoration:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}

.article h3{font-size:17px;font-weight:650;margin:24px 0 6px;font-family:var(--f-display)}
.article p{margin:8px 0}
.article ul{margin:8px 0;padding-left:20px;display:grid;gap:4px}
.article code{font-family:var(--f-num);font-size:.92em;background:var(--sunk);padding:0 4px;border-radius:4px}
.fx{margin-top:24px;background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.fx h3{margin-top:0}
.fx .rules{color:var(--muted);font-size:14px}
.fx .how{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.quiz{display:grid;gap:8px;margin-top:8px}
.quiz details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.quiz summary{cursor:pointer;font-weight:600;font-size:14.5px}
.quiz .a{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;font-size:14px}
.pager a{text-decoration:none;max-width:48%}

.src{margin-top:26px;font-size:13px;color:var(--muted)}
.src summary{cursor:pointer}
.src ul{padding-left:18px;margin:6px 0}
.src a{color:var(--muted);word-break:break-all}
.foot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.6}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);margin-top:24px}

/* 走势 */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tcards{display:grid;gap:10px}
.thead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.thead .nm{font-weight:600}
.thead .nm,.since{display:block}
.since{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.strip{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin-top:10px}
.cell{height:18px;border-radius:3px;background:var(--empty);position:relative;border:0;padding:0;cursor:default}
.cell>i{position:absolute;inset:0;border-radius:inherit}
.cell.up>i{background:var(--up)}.cell.down>i{background:var(--down)}.cell.flat>i{background:var(--faint);opacity:.4}
button.cell{cursor:pointer}
.cell[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.cap{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:6px;min-height:1.5em}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-soft);stroke:none}
.wait{font-size:13px;color:var(--muted);margin-top:10px;background:var(--sunk);border-radius:8px;padding:8px 10px}

/* 课程 */
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:20px}
.prog-top b{font-family:var(--f-display);font-size:26px}
.bar{height:8px;border-radius:99px;background:var(--sunk);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.step b{display:block;font-size:13px}
.step span{font-size:12px;color:var(--muted);line-height:1.45;display:block}
.mod-h{font-family:var(--f-display);font-size:17px;margin:26px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mod-h span{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lrow .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.lrow .tt{min-width:0;font-size:14.5px}
.lrow.todo .tt{color:var(--muted)}
.st{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--flat-soft);color:var(--muted);white-space:nowrap}
.st.done{background:var(--accent-soft);color:var(--accent)}
.st.next{background:var(--surface);border:1px dashed var(--accent);color:var(--accent)}

/* 往期 */
.arow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.arow .d{font-family:var(--f-num);font-size:12.5px;color:var(--muted);padding-top:2px;white-space:nowrap}
.arow .hd{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arow .ss{font-size:11.5px;margin-left:6px;color:var(--accent)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{appearance:none;background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){ .tab{transition:color .15s} }
</style>
</head>

比率"},{"id":"L27","num":27,"module":"M6","module_name":"风险与仓位","title":"仓位管理：一笔最多亏多少"},{"id":"L28","num":28,"module":"M6","module_name":"风险与仓位","title":"杠杆与融资融券"},{"id":"L29","num":29,"module":"M6","module_name":"风险与仓位","title":"尾部风险与黑天鹅"},{"id":"L30","num":30,"module":"M6","module_name":"风险与仓位","title":"汇率风险：用人民币投海外资产"},{"id":"L31","num":31,"module":"M7","module_name":"衍生品","title":"股指期货：基差与升贴水"},{"id":"L32","num":32,"module":"M7","module_name":"衍生品","title":"期权四要素与盈亏图"},{"id":"L33","num":33,"module":"M7","module_name":"衍生品","title":"希腊字母的直觉：Delta、Theta、Vega"},{"id":"L34","num":34,"module":"M7","module_name":"衍生品","title":"卖出看跌与备兑开仓：收益从哪来、风险在哪"},{"id":"L35","num":35,"module":"M7","module_name":"衍生品","title":"VIX 与波动率"},{"id":"L36","num":36,"module":"M8","module_name":"行为与体系","title":"行为偏差：损失厌恶、锚定、处置效应"},{"id":"L37","num":37,"module":"M8","module_name":"行为与体系","title":"叙事与泡沫"},{"id":"L38","num":38,"module":"M8","module_name":"行为与体系","title":"怎么读研报和新闻：事实、观点、利益"},{"id":"L39","num":39,"module":"M8","module_name":"行为与体系","title":"建立你的投资清单"},{"id":"L40","num":40,"module":"M8","module_name":"行为与体系","title":"交易日志与复盘：写下你的投资原则"}],"lessons":{"L01":{"id":"L01","date":"2026-11-05","title":"指数是怎么编出来的","hook":"11 月 4 日，同一个 A 股市场：科创 50 涨了 9.92%，上证指数只涨 2.16%。大洋对岸，道指涨 3.03%，纳指只涨 1.44%。都叫“大盘”，为什么差这么多？","core":"指数就是一份“买哪些股票、各买多少”的规则。选谁、怎么分份量、多久换一次，这三件事决定了它涨多少。","sections":[{"h":"第一件事：选谁","blocks":[{"t":"p","html":"上证指数装的是沪市几乎所有股票，银行、石油、保险这些巨无霸占了很大份量。科创 50 只装科创板里市值大、交易活跃的 50 家，大部分是半导体和硬科技公司。"},{"t":"p","html":"昨天领涨的是存储芯片、光刻、先进封装、CPO，几乎都在科创 50 和创业板里；而白酒、乳业在下跌，银行也没怎么动。所以上证被“传统经济”拖住了，科创 50 则是一篮子全押在当天最强的方向上。"}]},{"h":"第二件事：怎么分份量","blocks":[{"t":"p","html":"大多数指数按市值分份量（很多只算能在市场上流通的那部分），公司越大，说话越响。沪深 300、标普 500、恒生指数都是这个思路，只是各自还会给单只股票设上限，防止一家独大。"},{"t":"p","html":"道琼斯是少数按股价分份量的：股价高的股票影响大，跟公司大小无关。昨天道指里的 3M、微软、麦当劳、亚马逊、苹果都涨了 5% 到 9%，而道指里芯片股很少，所以它涨了 3%。纳指里芯片和 AI 算力的份量重，英伟达、美光、CoreWeave 下跌把它拖住了，只涨了 1.44%。"}]},{"h":"第三件事：多久换一次","blocks":[{"t":"p","html":"指数会定期调整成分股，变弱、变小的被换出，新的强者换进来。所以指数自带“优胜劣汰”，这是它长期跑赢大多数个股的原因之一。反过来，你看到的指数长期走势里也藏着幸存者偏差：被淘汰的公司已经不在里面了。"}]},{"h":"顺带一个放大器：涨跌停","blocks":[{"t":"p","html":"科创板和创业板单日涨跌幅上限是 20%，主板是 10%。昨天不少科创板公司涨了接近 20%，而主板股票最多只能涨 10%。同样的情绪，落在科创 50 上弹性就更大。"}]},{"h":"跟你的实盘有什么关系","blocks":[{"t":"p","html":"买一只 ETF，本质上是买下它背后那条指数规则。沪深 300 ETF、科创 50 ETF、纳指 ETF 涨跌差异这么大，原因就在上面三件事。判断自己赚得多还是少，也该拿持仓最像的那条指数来比，而不是一律对着上证指数。"}]}],"pitfalls":["只看点数不看百分比。道指涨 1,569 点看着吓人，其实是 3.03%；上证涨 78 点是 2.16%。跨指数比较只看百分比。","“大盘涨了我没赚”。你的持仓更像哪条指数，就拿哪条当参照，这就是基金说的“业绩比较基准”。","把“指数涨”当成“所有股票都涨”。昨天 A 股 4,667 家上涨、779 家下跌，白酒和乳业就是逆着大盘跌的。"],"feynman":{"prompt":["假设你在给一个从没买过股票的朋友解释：为什么 11 月 4 日科创 50 涨了快 10%，上证指数才涨 2%？用三到五句话讲清楚。"],"rules":["不许用“权重”“成分股”“加权”这几个词","至少用一个生活里的类比","写完后，把你讲得不顺的那一句写进“卡住的地方”"]},"quiz":[{"q":"道琼斯按股价分份量，会带来什么奇怪的后果？","a":[{"t":"p","html":"一只 1,000 美元的股票涨 1%，对道指的影响是一只 100 美元的股票涨 1% 的 10 倍，不管哪家公司更大。公司一拆股，股价变低，它在道指里的影响力就跟着变小，公司本身其实什么都没变。"}]},{"q":"如果你想跟踪“中国硬科技”的整体表现，该看哪条指数？为什么不是上证？","a":[{"t":"p","html":"科创 50 或创业板指更贴近，它们主要由半导体、新能源、医药等科技公司组成。上证里银行、能源、消费大盘股份量重，代表的更多是传统经济。"}]},{"q":"你现在的持仓或最想买的 ETF，跟踪的是哪条指数？前三大持仓是谁？","a":[{"t":"p","html":"开放题。在券商 App 或基金公司官网，找到这只 ETF 的“跟踪指数”和“前十大持仓”。养成买之前先看这一页的习惯。"}]}]},"L02":{"id":"L02","date":"2026-11-06","title":"三地交易规则：T+0 与 T+1、涨跌停、交易时间、做空","hook":"11 月 5 日美股收盘，美光一天跌了 17.46%，AMD 跌了 17.26%。同一天的 A 股，一只主板股票一天最多只能跌 10%。港股没有涨跌停，恒生科技那天涨了 5.55%。同样是买卖股票，三个市场的规则为什么差这么多？","core":"三地规则的差别主要在四件事上：当天买的能不能当天卖、一天最多涨跌多少、什么时候能交易、能不能做空。规则不同，同样的消息落下来，价格的走法就不一样。","sections":[{"h":"当天买的，能不能当天卖","blocks":[{"t":"p","html":"A 股是 T+1：今天买进的股票，最早明天才能卖。今天卖出股票拿到的钱，当天就能再买别的股票，只是要到下一个交易日才能转到银行卡。港股和美股都是 T+0，上午买、下午卖，没有限制。"},{"t":"p","html":"这条规则管的是交易。还有一个容易混的概念叫结算，就是钱和股票真正过户的时间。港股现在是 T+2 结算，港交所计划 2028 年下半年改成 T+1；美股从 2024 年 5 月起已经是 T+1 结算。结算周期影响的是卖出后多久能把钱取出来，不影响你当天能不能再交易。"},{"t":"p","html":"A 股也有例外：跨境 ETF（比如跟踪纳指、恒生的 ETF）、黄金 ETF、债券 ETF 和货币 ETF 可以当天买当天卖。打个比方，A 股的普通股票像一张当天不能转手的票，买了就得等到第二天；这几类 ETF 则随时可以转手。"}]},{"h":"一天最多涨跌多少","blocks":[{"t":"p","html":"A 股有涨跌停：主板每天最多涨跌 10%，创业板和科创板 20%，北交所 30%。新股上市的前 5 个交易日不设涨跌幅限制（北交所只有上市首日不设）。11 月 4 日不少科创板股票涨了接近 20%，就是碰到了上限。"},{"t":"p","html":"港股和美股的个股都没有涨跌停，所以 11 月 5 日美光能一天跌 17%。它们有别的减速带：港股对部分股票设有市场波动调节机制，价格和 5 分钟前比偏离太多（比如 10%），就要进入 5 分钟的冷静期，只能在限定范围内成交；美股对单只股票有价格带，短时间涨跌太快会暂停几分钟，对整个市场还有熔断，标普 500 盘中跌到 7% 和 13% 各暂停 15 分钟（临近收盘除外），跌到 20% 当天收市。11 月 5 日标普跌了 4.36%，离第一档还有距离。"},{"t":"p","html":"涨跌停像水库的闸门，能拦住一天之内的暴涨暴跌，但拦不住趋势。遇到很大的坏消息，A 股可能连续几天跌停，想卖都卖不出去；港股和美股往往一天就跌到位。两种做法各有代价，谈不上哪个更安全。"}]},{"h":"什么时候能交易（北京时间）","blocks":[{"t":"p","html":"A 股：9:15 到 9:25 是开盘集合竞价，9:30 到 11:30、13:00 到 15:00 连续交易，其中 14:57 到 15:00 是收盘集合竞价。"},{"t":"p","html":"港股：9:00 到 9:30 是开市前时段，9:30 到 12:00、13:00 到 16:00 连续交易，16:00 到 16:10 是收市竞价。2024 年 9 月起，香港挂台风信号或黑色暴雨警告时也照常交易。"},{"t":"p","html":"美股：美东时间 9:30 到 16:00。换成北京时间，冬令时（11 月第一个周日到次年 3 月第二个周日）是 22:30 到次日 5:00，夏令时是 21:30 到次日 4:00。今年 11 月 1 日美国已经换成冬令时，所以现在美股是北京时间 22:30 开盘。正式交易之外还有盘前和盘后，成交少，价格可能跳得更厉害。"},{"t":"p","html":"集合竞价可以理解成统一开门：先把一段时间里所有的买卖报价收集起来，算出一个能成交最多的价格，大家都按这个价成交。开盘价和收盘价就是这么来的。"}]},{"h":"能不能做空","blocks":[{"t":"p","html":"做空就是先借股票卖出，等跌了再买回来还上，赚中间的差价。三地都允许做空，难度差得很远。"},{"t":"p","html":"A 股做空靠融券：先要开融资融券账户，门槛一般是证券资产 50 万元、开户满半年，还得券商手里有券可借。2024 年 7 月起转融券业务暂停，券源本来就少，普通人很难做空 A 股。港股只能卖空交易所指定的股票，而且必须先借到股票，不允许裸卖空；通过港股通买港股的内地投资者不能做空。美股做空最普遍，借券方便，还有大量反向 ETF 和期权可以用来押注下跌。"},{"t":"p","html":"这会影响价格：容易做空的市场，看空的人能直接把观点打进价格里；难做空的市场，看空的人只能选择不买或者卖掉。"}]},{"h":"跟你的实盘有什么关系","blocks":[{"t":"p","html":"通过港股通买港股，同样可以当天来回买卖，但只有两地都开市、都能结算的日子才能交易，所以内地或香港放假时港股通会停。每手股数也不一样：A 股一手 100 股；港股每只股票自己定每手多少股，从几十股到几千股都有；美股 1 股起买，不少券商还能买零碎股。"},{"t":"p","html":"美股还有一个今年的变化：过去账户资产不到 2.5 万美元的人，5 个交易日里最多做 3 次日内交易。2026 年 SEC 批准取消这个门槛，6 月起已经生效，换成按实时风险计算的保证金要求。"}]}],"pitfalls":["以为 A 股 T+1 是\"卖出后钱要等一天才能用\"。卖出的钱当天就能买别的股票，只是下一个交易日才能转到银行卡；T+1 限制的是今天买的股票今天不能卖。","以为没有涨跌停就更危险。涨跌停只是把一天的涨跌摊到几天里，遇到大利空时，A 股可能连续跌停、想卖也卖不掉。","用北京时间记美股开盘，忘了冬夏令时。11 月到次年 3 月是 22:30 开盘，3 月到 11 月是 21:30。"],"feynman":{"prompt":["一个朋友问你：为什么 11 月 5 日美光一天能跌 17%，A 股的主板股票一天最多跌 10%？还有，为什么港股今天买了今天就能卖，A 股要等到明天？用三到五句话给他讲清楚。"],"rules":["不许用\"T+0\"\"T+1\"\"涨跌停\"\"熔断\"这几个词","至少用一个生活里的类比","写完后，把你讲得不顺的那一句写进\"卡住的地方\""]},"quiz":[{"q":"你上午在 A 股买了一只股票，下午它跌了 6%，你能卖掉吗？换成港股或美股呢？","a":[{"t":"p","html":"A 股不能，今天买的股票最早明天才能卖。港股和美股可以，当天就能卖出。A 股里的跨境 ETF、黄金 ETF、债券 ETF 和货币 ETF 是例外，当天可以卖。"}]},{"q":"一只科创板股票和一只港股，遇到同样大的利空，第一天最多分别能跌多少？","a":[{"t":"p","html":"科创板股票最多跌 20%（上市前 5 个交易日的新股除外）。港股没有涨跌停，理论上一天可以跌很多。所以 A 股可能分好几天跌完，港股往往一天就跌到位。"}]},{"q":"打开你的券商 App 查两件事：你持有或关注的一只港股，每手多少股？你持有或关注的一只 A 股 ETF，能不能当天买当天卖？","a":[{"t":"p","html":"开放题。港股的每手股数在个股详情页里，一般写作\"每手股数\"。ETF 能不能当天回转交易，看它是不是跨境、黄金、债券或货币 ETF，也可以在基金公司的产品页上查。"}]}]}},"next":"L03","start":"2026-11-05","updated":"2026-11-06 10:40","built":"34f996a025"};

  const md = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : '';
  function blocks(list){
    return (list || []).map(b => b.t === 'ul' ? h('ul', null, b.items.map(x => h('li',{html:x}))) : h('p',{html:b.html}));
  }

  /* ---------- 三地交易状态 ---------- */
  const MARKETS = [
    {name:'A股', tz:'Asia/Shanghai', s:[[570,690],[780,900]]},
    {name:'港股', tz:'Asia/Hong_Kong', s:[[570,720],[780,960]]},
    {name:'美股', tz:'America/New_York', s:[[570,960]]}
  ];
  function mStatus(m){
    try {
      const f = new Intl.DateTimeFormat('en-US',{timeZone:m.tz,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
      const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
      const min = (parseInt(p.hour,10)%24)*60 + parseInt(p.minute,10);
      if (p.weekday === 'Sat' || p.weekday === 'Sun') return ['休市', false];
      if (min < m.s[0][0]) return ['未开盘', false];
      if (min >= m.s[m.s.length-1][1]) return ['已收盘', false];
      for (const [a,b] of m.s) if (min >= a && min < b) return ['交易中', true];
      return ['午休', false];
    } catch(e){ return ['—', false]; }
  }
  function renderClocks(){
    $('#clocks').replaceChildren(...MARKETS.map(m => {
      const [t, open] = mStatus(m);
      return h('span',{class:'clock', title:'按常规交易时间推算，节假日以交易所公告为准'}, h('span',{class:'dot'+(open?' open':'')}), `${m.name} ${t}`);
    }));
  }

  /* ---------- 图 ---------- */
  function seriesOf(code){
    for (const m of D.markets) for (const i of m.indices) if (i.code === code) return i.s;
    return [];
  }
  function sparkFor(code, upto){
    const pts = seriesOf(code).filter(p => (!upto || p[0] <= upto) && typeof p[1] === 'number').slice(-20);
    if (pts.length < 2) return h('span',{class:'spark'});
    const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
    const d = pts.map((p,i) => `${(i/(pts.length-1)*54+1).toFixed(1)},${(18 - (p[1]-lo)/span*16).toFixed(1)}`).join(' ');
    const dir = ys[ys.length-1] >= ys[0] ? 'var(--up)' : 'var(--down)';
    return svg('svg',{class:'spark', viewBox:'0 0 56 20', 'aria-hidden':'true'},
      svg('polyline',{points:d, fill:'none', stroke:dir, 'stroke-width':'1.6', 'stroke-linejoin':'round', 'stroke-linecap':'round'}));
  }
  function bigChart(code){
    const pts = seriesOf(code).filter(p => typeof p[1] === 'number').slice(-120);
    if (pts.length < 2) return h('div',{class:'wait',text:'记到第 2 个交易日后开始画线。'});
    const W = 340, H = 150, L = 4, R = 54, T = 10, B = 22;
    const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || hi * 0.01 || 1;
    const x = i => L + i/(pts.length-1)*(W-L-R), y = v => T + (1 - (v-lo)/span)*(H-T-B);
    const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
    const area = `${x(0).toFixed(1)},${(H-B).toFixed(1)} ${line} ${x(pts.length-1).toFixed(1)},${(H-B).toFixed(1)}`;
    const last = pts[pts.length-1];
    return svg('svg',{class:'chart', viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':`${pts.length} 个交易日的收盘走势`},
      svg('line',{class:'grid', x1:L, x2:W-R, y1:y(hi), y2:y(hi)}),
      svg('line',{class:'grid', x1:L, x2:W-R, y1:y(lo), y2:y(lo)}),
      svg('polygon',{class:'ar', points:area}),
      svg('polyline',{class:'ln', points:line}),
      svg('circle',{cx:x(pts.length-1), cy:y(last[1]), r:3.5, fill: sign(last[2]) === 'down' ? 'var(--down)' : 'var(--up)'}),
      svg('text',{x:W-R+6, y:y(hi)+3.5}, fmtClose(hi)),
      svg('text',{x:W-R+6, y:y(lo)+3.5}, fmtClose(lo)),
      svg('text',{x:L, y:H-6}, md(pts[0][0])),
      svg('text',{x:W-R, y:H-6, 'text-anchor':'end'}, md(last[0]))
    );
  }

  /* ---------- 今天 / 某一期 ---------- */
  function mktPanel(m){
    return h('section',{class:'mkt'},
      h('div',{class:'mkt-h'}, h('b',{text:m.name}), m.asof ? h('span',{text:md(m.asof) + ' 收盘'}) : null),
      h('div',{class:'rows'}, (m.rows||[]).map(r =>
        h('div',{class:'row'},
          h('div',{class:'nm'}, r.name, h('small',{text:r.code})),
          sparkFor(r.code, m.asof),
          h('div',{class:'lv'}, fmtClose(r.close) + (r.note ? ' ' + r.note : '')),
          h('div',{class:'pct '+sign(r.pct)}, fmtPct(r.pct))
        ))),
      m.note ? h('div',{class:'mkt-note',text:m.note}) : null);
  }
  function lessonTeaser(id){
    const L = D.lessons[id];
    if (!L) return null;
    const meta = D.syllabus.find(s => s.id === id) || {};
    return h('article',{class:'lesson'},
      h('div',{class:'eyebrow',text:`第 ${meta.num} 课 · ${meta.module_name || ''}`}),
      h('h2',{text:L.title}),
      L.hook ? h('div',{class:'hook',html:L.hook}) : null,
      L.core ? h('p',{class:'core',html:L.core}) : null,
      h('a',{class:'go', href:'#lesson-'+id}, '去上课 · 读全文和费曼练习 →'));
  }
  function briefView(b){
    const up = (b.sectors && b.sectors.up) || [], down = (b.sectors && b.sectors.down) || [];
    const isLatest = D.latest && b.id === D.latest.id;
    return h('div', null,
      !isLatest ? h('a',{href:'#archive', class:'back', text:'← 往期'}) : null,
      h('div',{class:'dateline'}, h('div',{class:'date-big',text:dateLabel(b.date)}), h('span',{class:'session',text:SESS[b.session] || b.session})),
      h('p',{class:'headline',text:b.headline || ''}),
      b.updated ? h('div',{class:'asof',text:'更新于 ' + b.updated + '（北京时间）'}) : null,
      b.markets && b.markets.length ? [h('div',{class:'sec'}, h('span',{text:'三地行情'}), h('span',{class:'legend'}, h('b',{text:'红涨'}),' ',h('i',{text:'绿跌'}))), h('div',{class:'mkts'}, b.markets.map(mktPanel))] : null,
      b.macro && b.macro.length ? [h('div',{class:'sec',text:'利率 · 商品 · 情绪'}), h('div',{class:'macro'}, b.macro.map(x =>
        h('div',{class:'m'}, h('div',{class:'k',text:x.name}), h('div',{class:'v',text:x.value || '—'}), x.chg ? h('div',{class:'c '+(x.dir === 'up' ? 'up' : x.dir === 'down' ? 'down' : 'flat'),text:x.chg}) : null)))] : null,
      b.drivers && b.drivers.length ? [h('div',{class:'sec',text:'为什么这么走'}), h('div',{class:'drv'}, b.drivers.map(d => h('div', null, h('h3',{text:d.title}), h('p',{text:d.body}))))] : null,
      up.length || down.length ? [h('div',{class:'sec',text:'板块'}),
        up.length ? [h('div',{class:'chips-label',text:'走强'}), h('div',{class:'chips'}, up.map(x => h('span',{class:'chip up',text:x})))] : null,
        down.length ? [h('div',{class:'chips-label',text:'走弱'}), h('div',{class:'chips'}, down.map(x => h('span',{class:'chip down',text:x})))] : null] : null,
      b.watch && b.watch.length ? [h('div',{class:'sec',text:'接下来盯什么'}), h('div', null, b.watch.map(w => h('div',{class:'w'}, h('div',{class:'t',text:w.time || ''}), h('div',{text:w.item || ''}))))] : null,
      b.review && b.review.length ? [h('div',{class:'sec',text:'本周复习'}), h('div',{class:'review'}, h('ol', null, b.review.map(q => h('li',{text:q}))))] : null,
      lessonTeaser(b.lesson),
      b.sources && b.sources.length ? h('details',{class:'src'}, h('summary',{text:`信息来源（${b.sources.length}）`}),
        h('ul', null, b.sources.map(s => h('li', null, h('a',{href:s.url, target:'_blank', rel:'noopener', text:s.title || s.url}))))) : null,
      h('p',{class:'foot',text:'行情整理自公开财经报道，个别数字可能与券商行情有出入，以交易所和券商数据为准。内容用于学习，不构成投资建议。'}));
  }
  function viewToday(){
    if (S.briefId){
      if (D.latest && S.briefId === D.latest.id) return briefView(D.latest);
      if (S.brief && S.brief.id === S.briefId) return briefView(S.brief);
      if (S.briefState === 'error') return h('div', null, h('a',{href:'#archive', class:'back', text:'← 往期'}), h('div',{class:'note',text:'这一期没读出来，刷新再试一次。'}));
      return h('div',{class:'note',text:'正在读取这一期…'});
    }
    return D.latest ? briefView(D.latest) : h('div',{class:'note',text:'还没有日报。早报每个交易日 8:20 左右更新，晚报 16:30 左右。'});
  }
  async function loadBrief(id){
    S.brief = null; S.briefState = 'loading';
    try {
      const r = await fetch(`briefs/${encodeURIComponent(id)}.json`, {cache:'no-cache'});
      if (!r.ok) throw new Error(r.status);
      const b = await r.json();
      if (S.briefId === id){ S.brief = b; S.briefState = ''; render(); }
    } catch(e){ if (S.briefId === id){ S.briefState = 'error'; render(); } }
  }

  /* ---------- 走势 ---------- */
  function trendCard(i){
    const s = i.s || [];
    const last = s[s.length-1];
    const withClose = s.filter(p => typeof p[1] === 'number');
    let since = null;
    if (withClose.length >= 2) since = (withClose[withClose.length-1][1] / withClose[0][1] - 1) * 100;
    const recent = s.slice(-20);
    const pad = 20 - recent.length;
    const picked = S.pick[i.code];
    const capText = picked != null && recent[picked]
      ? `${md(recent[picked][0])}  收盘 ${fmtClose(recent[picked][1])}  ${fmtPct(recent[picked][2])}`
      : (recent.length ? `最近 ${recent.length} 个交易日，点格子看当天` : '');
    const open = S.openTrend.has(i.code);
    return h('div',{class:'tcard'},
      h('button',{class:'thead', type:'button', 'aria-expanded':open ? 'true' : 'false', id:'trend-'+i.code,
        onclick:() => { open ? S.openTrend.delete(i.code) : S.openTrend.add(i.code); render(); }},
        h('span',{class:'nm'}, i.name, h('span',{class:'since',text: since == null ? '记录还不够两天' : `${md(withClose[0][0])} 以来 ${fmtPct(since)}`})),
        h('span',{class:'lv',text:last ? fmtClose(last[1]) : '—'}),
        h('span',{class:'pct '+sign(last && last[2]),text:last ? fmtPct(last[2]) : '—'})),
      h('div',{class:'strip', role:'group', 'aria-label':`${i.name} 最近交易日涨跌`},
        Array.from({length:pad}, () => h('span',{class:'cell'})),
        recent.map((p, k) => {
          const a = Math.min(Math.abs(p[2] || 0) / 3, 1);
          return h('button',{class:'cell '+sign(p[2]), type:'button', 'aria-pressed': picked === k ? 'true' : 'false', 'aria-label':`${md(p[0])} ${fmtPct(p[2])}`,
            onclick:(ev) => { ev.stopPropagation(); S.pick[i.code] = picked === k ? null : k; render(); }},
            h('i',{style:`opacity:${(0.28 + 0.72*a).toFixed(2)}`}));
        })),
      h('div',{class:'cap',text:capText}),
      open ? bigChart(i.code) : null);
  }
  function viewTrend(){
    const first = D.markets.flatMap(m => m.indices.flatMap(i => i.s.map(p => p[0]))).sort()[0];
    return h('div', null,
      h('h1',{class:'page-title',text:'走势'}),
      h('p',{class:'sub',text: first ? `从 ${md(first)} 开始记录，每个交易日更新。每格是一天，颜色越深涨跌越大，点名字展开收盘走势。` : '还没有数据。'}),
      D.markets.map(m => [
        h('div',{class:'sec'}, h('span',{text:m.name}), m.id === D.markets[0].id ? h('span',{class:'legend'}, h('b',{text:'红涨'}),' ',h('i',{text:'绿跌'})) : null),
        h('div',{class:'tcards'}, m.indices.map(trendCard))
      ]));
  }

  /* ---------- 课程 ---------- */
  function viewCourse(){
    const taught = D.syllabus.filter(s => D.lessons[s.id]);
    const mods = [];
    for (const s of D.syllabus){
      let g = mods.find(m => m.key === s.module);
      if (!g){ g = {key:s.module, name:s.module_name, items:[]}; mods.push(g); }
      g.items.push(s);
    }
    return h('div', null,
      h('h1',{class:'page-title',text:'费曼投资课'}),
      h('div',{class:'prog-top'}, h('span', null, h('b',{text:String(taught.length)}), ` / ${D.syllabus.length} 课已开讲`),
        h('span',{class:'asof',text: D.next ? '下一课 ' + D.next : '全部开讲'})),
      h('div',{class:'bar'}, h('i',{style:`width:${Math.round(taught.length / D.syllabus.length * 100)}%`})),
      h('div',{class:'steps'},
        [['读','早报里开讲，用当天行情举例'],['讲','用大白话讲给不懂的人听'],['补','发给 Claude，指出没讲透的地方'],['复习','周六一周复盘']]
          .map(([a,b]) => h('div',{class:'step'}, h('b',{text:a}), h('span',{text:b})))),
      mods.map(g => [
        h('div',{class:'mod-h'}, h('b',{text:`${g.key.slice(1)}. ${g.name}`}), h('span',{text:`${g.items.filter(i => D.lessons[i.id]).length}/${g.items.length}`})),
        g.items.map(s => {
          const done = !!D.lessons[s.id];
          const st = done ? h('span',{class:'st done',text:md(D.lessons[s.id].date) + ' 开讲'}) : s.id === D.next ? h('span',{class:'st next',text:'下一课'}) : h('span',{class:'st',text:'待学'});
          const kids = [h('span',{class:'n',text:String(s.num).padStart(2,'0')}), h('span',{class:'tt',text:s.title}), st];
          return done ? h('a',{class:'lrow', href:'#lesson-'+s.id}, kids) : h('div',{class:'lrow todo'}, kids);
        })
      ]));
  }
  function viewLesson(id){
    const L = D.lessons[id];
    const meta = D.syllabus.find(s => s.id === id);
    if (!L || !meta) return h('div', null, h('a',{href:'#course', class:'back', text:'← 课程'}), h('div',{class:'note',text:'这一课还没开讲。'}));
    const taught = D.syllabus.filter(s => D.lessons[s.id]);
    const k = taught.findIndex(s => s.id === id);
    const prev = taught[k-1], next = taught[k+1];
    return h('div',{class:'article'},
      h('a',{href:'#course', class:'back', text:'← 课程'}),
      h('div',{class:'eyebrow', style:'margin-top:18px', text:`第 ${meta.num} 课 · ${meta.module_name} · ${md(L.date)} 开讲`}),
      h('h1',{class:'page-title', style:'margin-top:4px', text:L.title}),
      L.hook ? h('div',{class:'hook', html:L.hook}) : null,
      L.core ? h('p',{class:'core', html:L.core}) : null,
      L.sections.map(s => [h('h3',{html:s.h}), blocks(s.blocks)]),
      L.pitfalls.length ? [h('h3',{text:'常见误区'}), h('ul', null, L.pitfalls.map(x => h('li',{html:x})))] : null,
      h('section',{class:'fx'},
        h('h3',{text:'费曼练习：换你来讲'}),
        L.feynman.prompt.map(p => h('p',{html:p})),
        L.feynman.rules.length ? h('ul',{class:'rules'}, L.feynman.rules.map(r => h('li',{html:r}))) : null,
        h('p',{class:'how',text:'写好后直接发给 Claude（在早晚报推送的那个对话里回复就行），我会指出哪里讲透了、哪里没讲透，点评记进仓库，不放到这个页面上。'})),
      L.quiz.length ? [h('h3',{text:'自测'}), h('div',{class:'quiz'}, L.quiz.map(q => h('details', null, h('summary',{html:q.q}), h('div',{class:'a'}, blocks(q.a)))))] : null,
      h('div',{class:'pager'},
        prev ? h('a',{href:'#lesson-'+prev.id, text:'← ' + prev.title}) : h('span'),
        next ? h('a',{href:'#lesson-'+next.id, text:next.title + ' →', style:'text-align:right'}) : h('span')));
  }

  /* ---------- 往期 ---------- */
  function viewArchive(){
    return h('div', null,
      h('h1',{class:'page-title',text:'往期'}),
      h('p',{class:'sub',text:`共 ${D.archive.length} 期`}),
      h('div',{style:'margin-top:12px'}, D.archive.map(b => h('a',{class:'arow', href:'#brief-' + b.id},
        h('span',{class:'d',text:md(b.date) + ' ' + (WEEK[new Date(b.date + 'T00:00:00Z').getUTCDay()] || '')}),
        h('span',{class:'hd'}, b.headline, h('span',{class:'ss',text:SHORT[b.session] || ''}))))));
  }

  /* ---------- 路由 ---------- */
  function render(){
    const tab = S.view === 'lesson' ? 'course' : S.view === 'brief' ? (S.briefId && D.latest && S.briefId === D.latest.id ? 'today' : 'archive') : S.view;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === tab ? 'true' : 'false'));
    const v = S.view === 'trend' ? viewTrend() : S.view === 'course' ? viewCourse() : S.view === 'lesson' ? viewLesson(S.lessonId)
      : S.view === 'archive' ? viewArchive() : viewToday();
    $('#view').replaceChildren(v);
  }
  function route(){
    const k = location.hash.slice(1);
    S.briefId = null;
    if (k.startsWith('lesson-')){ S.view = 'lesson'; S.lessonId = k.slice(7); }
    else if (k.startsWith('brief-')){ S.view = 'brief'; S.briefId = k.slice(6); if (!(D.latest && S.briefId === D.latest.id)) loadBrief(S.briefId); }
    else if (['trend','course','archive'].includes(k)){ S.view = k; }
    else { S.view = 'today'; }
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    const target = '#' + t.dataset.v;
    if (location.hash === target) { route(); } else { location.hash = target; }
  }));
  window.addEventListener('hashchange', route);

  if (!D){ $('#view').replaceChildren(h('div',{class:'note',text:'页面数据缺失，请重新生成。'})); return; }
  renderClocks(); setInterval(renderClocks, 30000);
  route();

  /* 有新版本就刷新 */
  function checkVersion(){
    fetch(`version.json?t=${Date.now()}`, {cache:'no-store'}).then(r => r.json())
      .then(v => { if (v.built && v.built !== D.built) location.reload(); }).catch(() => {});
  }
  checkVersion();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ renderClocks(); checkVersion(); } });
})();
</script>
</body>
